name: Android Auto Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine Release Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            TAG_NAME="v${VERSION_NAME}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Focus-${{ steps.version.outputs.tag_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focus-${{ steps.version.outputs.tag_name }}-apk
          path: release-assets/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Focus ${{ steps.version.outputs.tag_name }}"
          body: |
            ## Focus ${{ steps.version.outputs.tag_name }} — Avtomatik Yangilanish (Auto Release)
            
            - **Yuklab olish:** Quyidagi `Focus-${{ steps.version.outputs.tag_name }}.apk` faylini yuklab olib o'rnating.
            - **Ilova ichidan yangilash:** Focus ilovasining **Sozlamalar** bo'limidagi **"Yangilanishni tekshirish"** tugmasi orqali to'g'ridan-to'g'ri yangilashingiz mumkin (`joxacybers/focus`).
            - **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/Focus-${{ steps.version.outputs.tag_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
